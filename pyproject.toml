[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scf-data-import"
version = "1.4.1"
description = "ETL pipeline to import SCF data from CSV/Excel into Django fixtures"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings (not needed for this project)
    "ANN",     # type annotations on all functions (too verbose for this scope)
    "S101",    # allow assert in tests
    "ERA",     # allow commented-out code during development
    "TD",      # allow TODO/FIXME comments
    "COM812",  # trailing comma rules conflict with formatter
    "ISC001",  # implicit string concat conflict with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "SLF", "ARG"]
"src/scf_import/derived.py" = ["C901", "PLR0912", "PLR0915"]
"src/scf_import/__main__.py" = ["PLR0915"]
"run.py" = ["T201", "S", "C901", "PLR", "SLF", "ARG", "E501", "E402", "RUF001", "PLC0415"]
"src/scf_import/management/**" = ["C901", "PLR0912", "PLR0915", "BLE001", "N806", "ARG001", "ARG002", "TRY301", "E501", "EM", "TRY", "PLC0415", "B904", "PGH003", "F841"]
"django_commands/**" = ["C901", "PLR0912", "PLR0915", "BLE001", "N806", "ARG001", "ARG002", "TRY301", "E501", "EM", "TRY", "PLC0415", "B904", "PGH003", "F841", "INP001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/", "venv/", "src/scf_import/management/"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
